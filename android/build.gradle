group = "com.replayfy.flutter"
version = "0.0.2"

buildscript {
    ext.kotlin_version = "1.9.10"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.1.0"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        // PRIMARY: the native Android SDK resolves from Maven Central
        // (app.replayfy:android-sdk) — mirrored + cached, so builds don't fail
        // with "No route to host" the way a single-host JitPack fetch can on
        // corporate/CI networks.
        mavenCentral()
        // FALLBACK: JitPack (com.github.replayfy:android-sdk), on-demand from a
        // git tag. Kept so older pins / pre-Central versions still resolve.
        maven { url "https://jitpack.io" }
        // Dev only — a local `:sdk:publishToMavenLocal`.
        mavenLocal()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace "com.replayfy.flutter"
    compileSdk 34

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        minSdk 21
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    // The native Android SDK that does the real recording, from Maven Central.
    // 0.0.5 is the first release that keeps the frames a Flutter app reports
    // across background/resume and drops the ones reported in the background.
    // It is also the first whose engine stop calls back once the session's
    // uploads have settled, which the plugin's stopApplicationAndUploadData
    // waits on without blocking the main thread. 0.0.7 blacks out the frames
    // a Flutter app reports while its window is FLAG_SECURE, covers them while
    // the whole screen is occluded, and rounds mask edges outward when it
    // scales a frame down.
    implementation "app.replayfy:android-sdk:0.0.7"

    // JVM unit tests (development only; not part of what an app links).
    // Robolectric gives the bridge tests the real main Looper channel replies
    // are posted to.
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.14.1"
}
