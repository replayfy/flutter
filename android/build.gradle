group = "com.replayfy.flutter"
version = "0.0.2"

buildscript {
    ext.kotlin_version = "1.9.10"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.1.0"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        // PRIMARY: the native Android SDK resolves from Maven Central
        // (app.replayfy:android-sdk) — mirrored + cached, so builds don't fail
        // with "No route to host" the way a single-host JitPack fetch can on
        // corporate/CI networks.
        mavenCentral()
        // FALLBACK: JitPack (com.github.replayfy:android-sdk), on-demand from a
        // git tag. Kept so older pins / pre-Central versions still resolve.
        maven { url "https://jitpack.io" }
        // Dev only — a local `:sdk:publishToMavenLocal`.
        mavenLocal()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace "com.replayfy.flutter"
    compileSdk 34

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        minSdk 21
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    // The native Android SDK that does the real recording, from Maven Central.
    // NOTE: requires this version to be published to Central (app.replayfy:
    // android-sdk) — see replay-android-sdk/PUBLISHING.md. Until then, the
    // JitPack fallback coordinate is `com.github.replayfy:android-sdk:0.0.3`.
    implementation "app.replayfy:android-sdk:0.0.3"
}
