group = "com.replayfy.flutter"
version = "0.0.2"

buildscript {
    ext.kotlin_version = "1.9.10"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.1.0"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        // The native Android SDK is published via JitPack
        // (com.github.replayfy:android-sdk); mavenLocal is only used when
        // building against a local `:sdk:publishToMavenLocal` in development.
        maven { url "https://jitpack.io" }
        mavenLocal()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace "com.replayfy.flutter"
    compileSdk 34

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        minSdk 21
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    // The native Android SDK that does the real recording, published via JitPack.
    implementation "com.github.replayfy:android-sdk:0.0.1"
}
