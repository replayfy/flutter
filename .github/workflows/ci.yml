name: CI

# Build gate — runs on every PR/push so a broken package can't be tagged/published.
# (pub.dev publishing itself is handled by publish.yml on a version tag.)
on:
  pull_request:
  push:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
