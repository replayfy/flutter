name: Publish (pub.dev)

# pub.dev's secure automated publishing is TAG-driven by design: it authenticates
# via GitHub OIDC (no long-lived token stored), and only trusts a tag whose name
# matches the pattern you configure on pub.dev. So the release ritual is:
#   1. bump `version:` in pubspec.yaml + add a CHANGELOG entry, merge to main
#   2. git tag v0.0.1 && git push origin v0.0.1   → this workflow publishes.
#
# One-time setup on pub.dev: open the `replayfy_flutter` package → Admin → Automated
# publishing → enable "Publishing from GitHub Actions", set repository
# `replayfy/flutter` and tag pattern `v{{version}}`.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

jobs:
  publish:
    permissions:
      id-token: write # required for OIDC auth to pub.dev — no secret needed
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
